<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Area of a Triangle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tools.css') }}">
</head>
<body>
    <main>
        <a class="back-link" href="{{ url_for('works') }}" onclick="if (history.length > 1) { history.back(); return false; }">&larr; Back</a>
        <section class="tool-panel" aria-labelledby="page-title">
            <p class="eyebrow">Triangle calculator</p>
            <h1 id="page-title">Area of a Triangle</h1>
            <p class="intro">Enter the base and height to calculate the triangle's area.</p>

            <form action="{{ url_for('atriangle') }}" method="post">
                <label for="base">Base</label>
                <input type="number" id="base" name="base" min="0" step="any" required>

                <label for="height">Height</label>
                <input type="number" id="height" name="height" min="0" step="any" required>

                <button type="submit">Calculate area</button>
            </form>

            {% if result is not none %}
            <p class="result" role="status">Area of the triangle: <strong>{{ "%.2f"|format(result) }}</strong></p>
            {% endif %}
        </section>
    </main>
</body>
</html>
