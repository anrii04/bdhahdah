<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Convert to Uppercase</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tools.css') }}">
</head>
<body>
    <main>
        <a class="back-link" href="{{ url_for('works') }}" onclick="if (history.length > 1) { history.back(); return false; }">&larr; Back</a>
        <section class="tool-panel" aria-labelledby="page-title">
            <p class="eyebrow">Text tool</p>
            <h1 id="page-title">Convert to Uppercase</h1>
            <p class="intro">Type a word or sentence and convert it to uppercase.</p>

            <form action="{{ url_for('uppercase') }}" method="post">
                <label for="inputString">Text</label>
                <input type="text" id="inputString" name="inputString" autocomplete="off">
                <button type="submit">Convert to uppercase</button>
            </form>

            {% if result is not none %}
            <p class="result" role="status">Converted text: <strong>{{ result }}</strong></p>
            {% endif %}
        </section>
    </main>
</body>
</html>
